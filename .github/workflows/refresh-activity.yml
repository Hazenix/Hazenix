name: Refresh GitHub activity card

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-activity-card

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render both themes
        run: python3 scripts/render_activity.py
      - name: Publish refreshed cards
        run: |
          git add assets/github-activity-light.svg assets/github-activity-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: 刷新 GitHub 统计卡片'
          git pull --rebase
          git push
